name: "Update Popular Posts"

on:
  schedule:
    # 매주 월요일 오전 9시 (KST = UTC+9) → UTC 00:00
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # pages-deploy.yml을 workflow_dispatch로 호출하기 위해 필요

jobs:
  update-popular-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-analytics-data pyyaml

      - name: Fetch popular posts from GA4
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_KEY: ${{ secrets.GA_SERVICE_ACCOUNT_KEY }}
        run: python scripts/fetch_popular_posts.py

      - name: Commit updated popular posts data
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _data/popular-posts.yml
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — 배포를 건너뜁니다."
          else
            git commit -m "chore: update popular posts data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 기본 GITHUB_TOKEN으로 push한 커밋은 on:push 워크플로를 트리거하지 않는다.
      # 그래서 데이터만 갱신되고 사이트는 재배포되지 않는 상태가 계속됐다.
      # 배포를 명시적으로 호출해 데이터 커밋이 실제 사이트에 반영되게 한다.
      - name: Trigger site deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref main
